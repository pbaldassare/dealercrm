<title>Etideal CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra laterale a pillole da 768px, barra in basso sul telefono; contenuto in card bianche su crema. Tema ripreso da ID Guard. */
:root{
  --bg:hsl(40 40% 94%);--fg:hsl(30 15% 13%);
  --card:hsl(0 0% 100%);--card-fg:hsl(30 15% 13%);
  --primary:hsl(190 75% 33%);--primary-fg:hsl(0 0% 100%);--primary-soft:hsl(190 75% 33% / .10);
  --secondary:hsl(40 30% 89%);--muted:hsl(40 28% 91%);--muted-fg:hsl(35 10% 38%);
  --accent:hsl(191 92% 26%);
  --border:hsl(40 22% 85%);--input:hsl(40 22% 82%);
  --success:hsl(142 76% 36%);--success-ink:hsl(142 76% 24%);
  --warning:hsl(38 92% 50%);--warning-ink:hsl(38 92% 27%);
  --danger:hsl(25 95% 53%);--danger-ink:hsl(25 95% 32%);
  --destructive:hsl(4 72% 51%);--destructive-ink:hsl(4 72% 38%);
  --info:hsl(221 83% 53%);--info-ink:hsl(221 83% 40%);
  --radius:1rem;
  --gradient-primary:linear-gradient(135deg,hsl(190 75% 33%) 0%,hsl(187 65% 42%) 100%);
  --shadow-glow:0 12px 32px -12px hsl(190 75% 33% / .35);
  --shadow-card:0 1px 2px hsl(30 20% 15% / .05),0 10px 28px -18px hsl(30 20% 15% / .16);
  --font-sans:"Quicksand",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Baloo 2","Quicksand",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:hsl(30 12% 9%);--fg:hsl(40 25% 92%);--card:hsl(30 10% 13%);--card-fg:hsl(40 25% 92%);
  --primary:hsl(188 70% 45%);--primary-fg:hsl(30 15% 8%);--primary-soft:hsl(188 70% 45% / .14);
  --secondary:hsl(30 8% 18%);--muted:hsl(30 8% 16%);--muted-fg:hsl(35 10% 65%);--accent:hsl(188 80% 55%);
  --border:hsl(30 8% 22%);--input:hsl(30 8% 26%);
  --success-ink:hsl(142 60% 60%);--warning-ink:hsl(38 90% 62%);--danger-ink:hsl(25 90% 64%);--destructive-ink:hsl(4 80% 68%);--info-ink:hsl(221 85% 72%);
  --shadow-card:0 1px 2px hsl(0 0% 0% / .3),0 10px 28px -18px hsl(0 0% 0% / .5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:hsl(30 12% 9%);--fg:hsl(40 25% 92%);--card:hsl(30 10% 13%);--card-fg:hsl(40 25% 92%);
  --primary:hsl(188 70% 45%);--primary-fg:hsl(30 15% 8%);--primary-soft:hsl(188 70% 45% / .14);
  --secondary:hsl(30 8% 18%);--muted:hsl(30 8% 16%);--muted-fg:hsl(35 10% 65%);--accent:hsl(188 80% 55%);
  --border:hsl(30 8% 22%);--input:hsl(30 8% 26%);
  --success-ink:hsl(142 60% 60%);--warning-ink:hsl(38 90% 62%);--danger-ink:hsl(25 90% 64%);--destructive-ink:hsl(4 80% 68%);--info-ink:hsl(221 85% 72%);
  --shadow-card:0 1px 2px hsl(0 0% 0% / .3),0 10px 28px -18px hsl(0 0% 0% / .5);color-scheme:dark}

*{box-sizing:border-box;border-color:var(--border)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-weight:500;line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.6rem;letter-spacing:-.015em}
h2{font-size:1.2rem}
h3{font-size:1.02rem}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
.app{display:flex;height:100%;overflow:hidden}
aside{display:none;width:250px;flex-direction:column;border-right:1px solid var(--border);background:var(--card)}
.brand{display:flex;gap:.75rem;align-items:center;padding:1.25rem;border-bottom:1px solid var(--border)}
.brand .logo{width:42px;height:42px;border-radius:14px;background:var(--gradient-primary);display:grid;place-items:center;color:#fff;box-shadow:var(--shadow-glow);flex:none}
.brand b{display:block;font-family:var(--font-display);font-size:1.05rem;line-height:1.15}
.brand small{color:var(--muted-fg);font-size:.78rem}
.nav{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.25rem}
.nav button{display:flex;gap:.75rem;align-items:center;width:100%;padding:.7rem 1rem;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted-fg);transition:all .3s cubic-bezier(.4,0,.2,1)}
.nav button:hover{background:var(--secondary);color:var(--fg)}
.nav button.on{background:var(--primary);color:var(--primary-fg);box-shadow:var(--shadow-glow)}
.nav svg,.tabbar svg{width:18px;height:18px;flex:none}
.aside-foot{border-top:1px solid var(--border);padding:1rem;font-size:.82rem;color:var(--muted-fg)}
.aside-foot select{width:100%;margin-top:.4rem;padding:.5rem .7rem;border:1px solid var(--input);border-radius:12px;background:var(--card)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:.75rem;padding:.7rem max(16px,env(safe-area-inset-right,0px)) .7rem max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--border);background:var(--card)}
.topbar .logo{width:34px;height:34px;border-radius:11px;background:var(--gradient-primary);display:grid;place-items:center;color:#fff}
.topbar h1{font-size:1.15rem;flex:1}
.topbar .role{font-size:.72rem;color:var(--primary);background:var(--primary-soft);padding:.25rem .6rem;border-radius:999px;font-weight:700}
main{flex:1;overflow-y:auto;padding-block:1.1rem 6rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--border);padding:.4rem max(8px,env(safe-area-inset-right,0px)) calc(.4rem + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.66rem;font-weight:700;color:var(--muted-fg);padding:.35rem .5rem;border-radius:14px;min-width:52px}
.tabbar button.on{color:var(--primary);background:var(--primary-soft)}
@media(min-width:768px){aside{display:flex}.topbar,.tabbar{display:none}main{padding-block:1.6rem 2rem}}

.card{background:var(--card);color:var(--card-fg);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow-card);padding:1rem 1.1rem}
.card.pad0{padding:0;overflow:hidden}
.head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.head p{margin:.15rem 0 0;color:var(--muted-fg);font-size:.9rem}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{padding:.9rem 1rem}
.kpi .l{font-size:.74rem;color:var(--muted-fg);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-family:var(--font-display);font-size:1.5rem;font-weight:800;line-height:1.1;margin-top:.2rem;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.78rem;color:var(--muted-fg);margin-top:.15rem}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:.85rem;align-items:center;padding:.85rem 1.1rem;border-top:1px solid var(--border);width:100%;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:var(--muted)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:.82rem;color:var(--muted-fg)}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;flex:none;background:var(--secondary);color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;white-space:nowrap}
.p-ok{background:hsl(142 76% 36% / .12);color:var(--success-ink)}
.p-warn{background:hsl(38 92% 50% / .14);color:var(--warning-ink)}
.p-hot{background:hsl(25 95% 53% / .14);color:var(--danger-ink)}
.p-bad{background:hsl(4 72% 51% / .12);color:var(--destructive-ink)}
.p-info{background:hsl(221 83% 53% / .12);color:var(--info-ink)}
.p-muted{background:var(--secondary);color:var(--muted-fg)}
.p-primary{background:var(--primary-soft);color:var(--primary)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-family:var(--font-display);font-size:.95rem;min-width:62px;text-align:right}
.timer.ok{color:var(--success-ink)}.timer.warn{color:var(--warning-ink)}.timer.late{color:var(--destructive-ink)}
.timer small{display:block;font:600 .66rem var(--font-sans);color:var(--muted-fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 1.1rem;border-radius:999px;font-weight:700;font-size:.88rem;border:1px solid transparent;min-height:44px;transition:transform .2s,box-shadow .2s}
.btn.primary{background:var(--primary);color:var(--primary-fg);box-shadow:var(--shadow-glow)}
.btn.outline{border-color:var(--input);background:var(--card)}
.btn.ghost{color:var(--primary)}
.btn:active{transform:scale(.97)}
.btn.sm{min-height:36px;padding:.4rem .85rem;font-size:.8rem}
.btns{display:flex;gap:.5rem;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--input);border-radius:999px;padding:.35rem .5rem .35rem 1rem}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:1rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.search input::placeholder{text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted-fg)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem;scrollbar-width:none}
.chips button{flex:none;padding:.35rem .8rem;border-radius:999px;border:1px solid var(--input);font-size:.8rem;font-weight:600;background:var(--card)}
.chips button.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.grid2{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.kv{display:grid;grid-template-columns:1fr auto;gap:.35rem .75rem;font-size:.9rem}
.kv dt{color:var(--muted-fg);margin:0}.kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:999px;background:var(--muted);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--gradient-primary)}
.tl{list-style:none;margin:0;padding:0 0 0 1.1rem;border-left:2px solid var(--border);display:flex;flex-direction:column;gap:.7rem}
.tl li{position:relative;font-size:.88rem}
.tl li::before{content:"";position:absolute;left:calc(-1.1rem - 6px);top:.45rem;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--card)}
.tl li span{display:block;color:var(--muted-fg);font-size:.76rem}
.margin{display:flex;flex-direction:column;gap:.45rem}
.mrow{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center;font-size:.9rem}
.mrow .bar{grid-column:1/-1}
.mrow .amt{font-weight:700;font-variant-numeric:tabular-nums}
.mrow .amt.neg{color:var(--destructive-ink)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:.7rem;margin-top:.3rem;border-top:1px dashed var(--border)}
.total b{font-family:var(--font-display);font-size:1.5rem;font-weight:800;color:var(--primary)}
.yard{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:.45rem}
.slot{aspect-ratio:1;border-radius:14px;border:1.5px dashed var(--input);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;color:var(--muted-fg);padding:.2rem;text-align:center}
.slot.busy{border:0;background:var(--primary-soft);color:var(--primary)}
.slot.busy b{font-size:.62rem;letter-spacing:.03em;line-height:1.1}
.slot.sel{outline:3px solid var(--primary);outline-offset:2px}
.slot.shop{background:hsl(38 92% 50% / .14);border:0;color:var(--warning-ink)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 0;border-top:1px solid var(--border)}
.sw:first-child{border-top:0}
.sw span{display:block;font-size:.8rem;color:var(--muted-fg)}
.toggle{width:48px;height:28px;border-radius:999px;background:var(--input);position:relative;flex:none;transition:background .25s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on{background:var(--primary)}.toggle.on::after{transform:translateX(20px)}
.num{display:flex;align-items:center;gap:.4rem}
.num input{width:64px;padding:.35rem .5rem;border:1px solid var(--input);border-radius:10px;background:var(--card);text-align:right;font-variant-numeric:tabular-nums}
.back{display:inline-flex;align-items:center;gap:.3rem;color:var(--primary);font-weight:700;font-size:.88rem;padding:.2rem 0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:.45rem}
.photo{aspect-ratio:4/3;border-radius:12px;background:var(--secondary);display:grid;place-items:center;color:var(--muted-fg);font-size:.68rem;font-weight:600;text-align:center;padding:.3rem}
.photo.add{border:1.5px dashed var(--input);background:none;color:var(--primary)}
.dmg{display:flex;gap:.5rem;align-items:center;font-size:.86rem;padding:.4rem 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-size:.85rem;font-weight:600;box-shadow:var(--shadow-card);z-index:20;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
@media(min-width:768px){.toast{bottom:1.5rem}}
.ai-box{background:var(--primary-soft);border-radius:14px;padding:.8rem 1rem;font-size:.88rem}
.ai-box b{color:var(--primary)}
.demo{font-size:.72rem;color:var(--muted-fg);text-align:center}
.fade{animation:fade .45s cubic-bezier(.16,1,.3,1) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}*{transition:none!important}}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
</style>
<style>
.state{display:flex;flex-direction:column;align-items:center;gap:.8rem;padding:3rem 1rem;text-align:center;color:var(--muted-fg)}
.state h2{color:var(--fg)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.live{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:700;color:var(--success-ink)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--success)}
.busy-ov{position:fixed;inset:0;background:hsl(0 0% 0% / .08);z-index:15;display:none}
.busy-ov.on{display:block}
.err{background:hsl(4 72% 51% / .1);color:var(--destructive-ink);border-radius:14px;padding:.8rem 1rem;font-size:.88rem}
</style>
<div class="app">
  <aside>
    <div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14l-1.5-5.5a2 2 0 0 0-1.9-1.5H8.4a2 2 0 0 0-1.9 1.5Z"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/><path d="M3 12h2M19 12h2"/></svg></div><div><b>Etideal CRM</b><small>Concessionario demo</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="aside-foot"><span id="liveD"></span>Ruolo attivo<select id="roleD"></select></div>
  </aside>
  <div class="main">
    <div class="topbar"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14l-1.5-5.5a2 2 0 0 0-1.9-1.5H8.4a2 2 0 0 0-1.9 1.5Z"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></svg></div><h1 id="topTitle">Oggi</h1><select id="roleM" class="role" aria-label="Ruolo"></select></div>
    <main><div class="wrap" id="view"><div class="state"><div class="spin"></div><h2>Collegamento a Supabase</h2><p>Carico i dati del concessionario dal progetto etidealcrm.</p></div></div></main>
    <div class="tabbar" id="tabbar"></div>
  </div>
</div>
<div class="busy-ov" id="busy"></div>
<div class="toast" id="toast"></div>

<script>
// ---------- Collegamento a Supabase tramite il connettore del visualizzatore ----------

let mcp = null, D = null, loadedAt = null;

function parsePayload(p){
  // execute_sql risponde con {result: "...<untrusted-data-x>[json]</untrusted-data-x>"}
  let txt = typeof p === "string" ? p : (p && typeof p.result === "string" ? p.result : null);
  if (txt == null) { if (Array.isArray(p)) return p; throw new Error("risposta non riconosciuta"); }
  const m = txt.match(/<untrusted-data-[\w-]+>\s*(\[[\s\S]*\])\s*<\/untrusted-data/);
  if (m) return JSON.parse(m[1]);
  const t = txt.trim(); if (t.startsWith("[")||t.startsWith("{")) return JSON.parse(t);
  return [];
}
async function sql(query, opts){
  const r = await mcp.callTool("Supabase", "execute_sql", { project_id: PROJECT, query }, opts || { cache: false });
  return parsePayload(r.payload);
}
const q = s => String(s).replace(/'/g, "''");

async function load(){
  const rows = await sql(LOAD_SQL);
  D = rows[0].data;
  D.vehicles = D.vehicles || []; D.leads = D.leads || []; D.sellers = D.sellers || []; D.deals = D.deals || []; D.zones = D.zones || []; D.settings = D.settings || {};
  D.byV = Object.fromEntries(D.vehicles.map(v => [v.id, v]));
  D.byS = Object.fromEntries(D.sellers.map(s => [s.id, s]));
  loadedAt = new Date();
  render();
}
async function write(label, query){
  const ov = document.getElementById("busy"); ov.classList.add("on");
  try { await sql(query); await load(); toast(label); }
  catch (e) { showError(e); }
  finally { ov.classList.remove("on"); }
}
function showError(e){
  const code = e && e.code; let msg;
  if (code === "server_not_connected") msg = "Collega il connettore Supabase in claude.ai (Impostazioni → Connettori).";
  else if (code === "needs_reauth") msg = "Il connettore Supabase va ricollegato in claude.ai.";
  else if (code === "not_in_manifest" || code === "approval_required") msg = "Serve il permesso per usare Supabase da questa pagina.";
  else if (code === "tool_error") msg = "Supabase ha rifiutato l'operazione: " + (e.message||"").slice(0,200);
  else msg = (e && e.message) || "Errore sconosciuto";
  toast(msg);
  const v = document.getElementById("view");
  if (!D) v.innerHTML = `<div class="state"><h2>Non riesco a leggere i dati</h2><div class="err">${esc(msg)}</div><button class="btn primary" onclick="boot()">Riprova</button></div>`;
}
async function boot(){
  try {
    mcp = await (window.claude && window.claude.use ? window.claude.use("mcp") : Promise.resolve(null));
    if (!mcp) {
      document.getElementById("view").innerHTML = `<div class="state"><h2>Serve claude.ai</h2><p>Questa pagina legge i dati dal tuo progetto Supabase tramite il connettore di claude.ai. Aprila da claude.ai con il connettore Supabase attivo.</p></div>`;
      return;
    }
    await load();
  } catch (e) { showError(e); }
}

function timerFor(l){
  if(!l.deadline) return "";
  const left = new Date(l.deadline)-Date.now(), total = new Date(l.deadline)-new Date(l.since), pct = total>0?left/total:1;
  const cls = left<0?"late":pct<.25?"warn":"ok";
  const abs=Math.abs(left), txt = abs<3600000?Math.round(abs/60000)+" min":abs<86400000?Math.round(abs/3600000)+" h":Math.round(abs/86400000)+" g";
  return `<div class="timer ${cls}">${left<0?"−":""}${txt}<small>${left<0?"scaduto":"residuo"}</small></div>`;
}

    <div class="card"><h3>Assistente IA</h3><div style="margin-top:.5rem">${sw("voice","Telefonate","Risponde e qualifica le chiamate in arrivo")}${sw("whatsapp","WhatsApp","Risponde ai messaggi con modelli approvati")}${sw("social","Social","Instagram e Facebook DM")}${sw("out_of_hours_reply","Fuori orario","Risponde anche fuori dall'orario di lavoro")}</div><p style="font-size:.8rem;color:var(--muted-fg);margin:.8rem 0 0">Modalità: ${lbl(a.mode)}. Canale spento: le lead nuove vanno al responsabile vendite con una notifica.</p></div>
    <div class="card"><h3>Timer lead assegnata</h3><div style="margin-top:.5rem">
      ${num("escalation_assigned_min.warn_salesperson",esc_.warn_salesperson,"Avviso al venditore","minuti senza presa in carico","min")}
      ${num("escalation_assigned_min.warn_manager",esc_.warn_manager,"Avviso al responsabile","minuti","min")}
      ${num("escalation_assigned_min.reassign",esc_.reassign,"Riassegnazione automatica","minuti","min")}
      ${num("max_reassignments",t.max_reassignments,"Riassegnazioni massime","poi al responsabile","")}
      ${num("auto_lose_days",t.auto_lose_days,"Persa automatica","giorni senza attività","gg")}
    </div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Fatture in Cloud</h3><dl class="kv" style="margin-top:.6rem"><dt>Stato</dt><dd>${(D.fic&&D.fic.connected)?"Collegato · "+esc(D.fic.company_name||D.fic.company_id):"Non collegato"}</dd><dt>Azienda</dt><dd>${esc(fc.company_id||"—")}</dd><dt>Numerazione</dt><dd>${esc(fc.numeration||"—")}</dd><dt>IVA standard / margine</dt><dd>${esc(fc.vat_id_standard??"—")} / ${esc(fc.vat_id_margin??"—")}</dd><dt>Fattura alla</dt><dd>${fc.invoice_on==="signed"?"firma":"consegna"}</dd></dl>
      <div style="margin-top:.4rem">${swf("enabled","Integrazione attiva","Spenta: le fatture restano in coda")}${swf("dry_run","Modalità prova","Verifica i totali senza creare documenti")}</div>
      <p style="font-size:.8rem;color:var(--muted-fg);margin:.8rem 0 0">Per collegare: apri fic-oauth?action=start con i segreti impostati; poi le aliquote da fic-invoice?action=lookups.</p></div>
    <div class="card"><h3>Google Maps</h3><dl class="kv" style="margin-top:.6rem"><dt>Sede (lat, lng)</dt><dd>${D.dealership&&D.dealership.lat?D.dealership.lat.toFixed(5)+", "+D.dealership.lng.toFixed(5):"da impostare"}</dd><dt>Map ID</dt><dd>${esc(mp.map_id||"da impostare")}</dd><dt>Vista</dt><dd>${lbl(mp.map_type)} · zoom ${mp.default_zoom}</dd><dt>Aggancio allo stallo</dt><dd>${mp.snap_radius_m} m</dd><dt>Stalli con coordinate</dt><dd>${D.slots_geo||0}/${D.zones.reduce((a,z)=>a+(z.slots||[]).length,0)}</dd></dl>
      <div class="num" style="margin-top:.8rem;flex-wrap:wrap"><input id="m_lat" type="text" placeholder="lat" value="${D.dealership&&D.dealership.lat||""}" style="width:110px;text-align:left"><input id="m_lng" type="text" placeholder="lng" value="${D.dealership&&D.dealership.lng||""}" style="width:110px;text-align:left"><button class="btn primary sm" onclick="setCenter()">Salva sede</button></div>
      <p style="font-size:.8rem;color:var(--muted-fg);margin:.8rem 0 0">La mappa satellitare vive nell'app vera (Maps JavaScript API): questa pagina non può caricare script di Google.</p></div>
  </div>
  <div class="card"><h3>Assegnazione</h3><dl class="kv" style="margin-top:.6rem"><dt>Performance</dt><dd>${Math.round((w.performance||0)*100)}%</dd><dt>Rotazione</dt><dd>${Math.round((w.rotation||0)*100)}%</dd><dt>Carico</dt><dd>${Math.round((w.load||0)*100)}%</dd><dt>Lead aperte max</dt><dd>${ap.max_open_leads??"—"}</dd><dt>Fascia A</dt><dd>fino a ${fmt(vb.A&&vb.A.max)}</dd><dt>Fascia B</dt><dd>${fmt(vb.B&&vb.B.min)} – ${fmt(vb.B&&vb.B.max)}</dd><dt>Fascia C</dt><dd>${fmt(vb.C&&vb.C.min)} – ${fmt(vb.C&&vb.C.max)} · solo sopra la mediana</dd><dt>Fascia D</dt><dd>oltre ${fmt(vb.D&&vb.D.min)} · i ${ap.band_d_top_n||3} migliori</dd></dl></div>
  <div class="card pad0"><div class="head" style="padding:1rem 1.1rem .5rem"><h3>Venditori</h3></div><div class="list">${D.sellers.filter(s=>s.role==="salesperson").map(s=>`<div class="row"><div class="av">${esc(s.name.split(" ").map(x=>x[0]).join(""))}</div><div class="t"><b>${esc(s.name)}</b><span>chiusura ${Math.round(Number(s.rate)*100)}% · risposta ${s.resp??"—"} min · ${s.open} aperte · ${s.recv30} ricevute 30 gg · fasce ${(s.bands||[]).join("-")}</span></div>${!s.available?'<span class="pill p-muted">Non disponibile</span>':(s.bands||[]).includes("D")?'<span class="pill p-ok">A-D</span>':'<span class="pill p-info">A-B</span>'}</div>`).join("")}</div></div>`;
}
function setAi(k,val,n){ write(`${n}: ${val?"acceso":"spento"}`, `update etidealcrm.setting set value = jsonb_set(value,'{${k}}','${val}'::jsonb), updated_at=now() where key='ai_switches'`); }
function setFic(k,val,n){ write(`${n}: ${val?"sì":"no"}`, `update etidealcrm.setting set value = jsonb_set(value,'{${k}}','${val}'::jsonb), updated_at=now() where key='fatture_in_cloud'`); }
function setCenter(){ const la=parseFloat(document.getElementById("m_lat").value.replace(",",".")), ln=parseFloat(document.getElementById("m_lng").value.replace(",",".")); if(isNaN(la)||isNaN(ln)) return toast("Inserisci latitudine e longitudine"); write("Sede salvata", `update etidealcrm.dealership set lat=${la}, lng=${ln}`); }
function setTimer(path,val,n){ const p="{"+path.split(".").join(",")+"}"; write(`Salvato: ${n} = ${val}`, `update etidealcrm.setting set value = jsonb_set(value,'${p}','${Number(val)||0}'::jsonb), updated_at=now() where key='lead_timers'`); }

// ---------- Render ----------
const V={oggi:vOggi,lead:vLead,auto:vAuto,pratica:vPratica,piazzale:vPiazzale,parametri:vParametri};
function render(){
  if(!D) return;
  const vis=SCREENS.filter(([k])=>!(S.role==="yard"&&(k==="parametri"||k==="pratica")));
  if(!vis.some(([k])=>k===S.screen)) S.screen="oggi";
  document.getElementById("nav").innerHTML=vis.map(([k,n])=>`<button class="${S.screen===k?"on":""}" onclick="go('${k}')">${ic[k]}<span>${n}</span></button>`).join("");
  document.getElementById("tabbar").innerHTML=vis.map(([k,n])=>`<button class="${S.screen===k?"on":""}" onclick="go('${k}')">${ic[k]}${n}</button>`).join("");
  document.getElementById("topTitle").textContent=SCREENS.find(s=>s[0]===S.screen)[1];
  document.getElementById("liveD").innerHTML=`<span class="live"><i></i>Supabase · ${loadedAt?loadedAt.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):""}</span><br>`;
  const view=document.getElementById("view");view.className="wrap fade";view.innerHTML=V[S.screen]();
  for(const id of["roleD","roleM"]){const s=document.getElementById(id);s.innerHTML=Object.entries(ROLES).map(([k,n])=>`<option value="${k}" ${S.role===k?"selected":""}>${n}</option>`).join("");s.onchange=e=>{S.role=e.target.value;S.lead=null;S.veh=null;render();toast("Ruolo: "+ROLES[S.role])}}
}
function renderKeep(){const el=document.getElementById("q");const pos=el.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)}
boot();
</script>
